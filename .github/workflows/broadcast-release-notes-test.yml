# Attached resources:
# - GitHub SECRETS:
#     -> global: GOOGLE_CHAT_WEBHOOK -> Webhook URL for posting messages to gchat

name: Broadcast Release Notes (Test)
on:
  workflow_dispatch:
jobs:
  release-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send dummy release notes to Google Chat
        uses: actions/github-script@v7
        with:
          script: |
            console.log("Context:\n" + JSON.stringify(context));
            const test = require('./.github/scripts/broadcast_release_notes_test.js');
            await test.run(context, core, '${{ secrets.GOOGLE_CHAT_WEBHOOK }}');
